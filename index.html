<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>the goat</title>
<style>
  :root {
    --bg-top: #4f9eea;
    --bg-mid: #8ec4f2;
    --bg-bottom: #dcedfb;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    cursor: default;
    position: relative;
  }

  .sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .cloud-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 100%;
    display: flex;
    align-items: flex-start;
  }

  .cloud-layer.back {
    animation: drift 220s linear infinite;
    opacity: 0.5;
    filter: blur(5px);
  }

  .cloud-layer.mid {
    animation: drift 140s linear infinite;
    opacity: 0.72;
    filter: blur(2.5px);
  }

  .cloud-layer.front {
    animation: drift 85s linear infinite;
    opacity: 0.95;
    filter: blur(0.5px);
  }

  .cloud {
    position: absolute;
    border-radius: 50%;
    /* several soft, irregular puffs layered together read as a real
       cumulus cloud instead of a hard cartoon blob; a faint cool-grey
       gradient near the base gives it volume/underside shading */
    background:
      radial-gradient(ellipse 42% 55% at 22% 70%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 38% 60% at 46% 35%, rgba(255,255,255,1)   0%, rgba(255,255,255,0) 74%),
      radial-gradient(ellipse 46% 62% at 70% 55%, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0) 72%),
      radial-gradient(ellipse 30% 45% at 88% 68%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 75%),
      radial-gradient(ellipse 60% 40% at 50% 78%, rgba(200,213,230,0.55) 0%, rgba(200,213,230,0) 80%);
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
  }

  .goat-wrap {
    position: relative;
    width: min(60vw, 520px);
    will-change: transform;
    transform-style: preserve-3d;
  }

  .goat-img {
    display: block;
    width: 100%;
    height: auto;
    filter: saturate(1.05) contrast(1.02);
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
    /* the source photo is cropped with a hard straight edge at the
       shoulders; fade it out over the bottom ~14% so it dissolves
       into the page instead of showing a visible cut line */
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 86%, transparent 99%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 86%, transparent 99%);
  }

  footer {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: rgba(30, 45, 70, 0.55);
    font-weight: 400;
  }

  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(30, 45, 70, 0.25);
    padding-bottom: 1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  footer a:hover {
    color: rgba(30, 45, 70, 0.9);
    border-color: rgba(30, 45, 70, 0.6);
  }

  .cloud.small  { width: 130px; height: 70px; }
  .cloud        { width: 210px; height: 110px; }
  .cloud.large  { width: 320px; height: 160px; }
</style>
</head>
<body>

  <div class="sky" aria-hidden="true">
    <div class="cloud-layer back">
      <div class="cloud large" style="left: 4vw; top: 8%;"></div>
      <div class="cloud" style="left: 34vw; top: 18%;"></div>
      <div class="cloud small" style="left: 62vw; top: 6%;"></div>
      <div class="cloud large" style="left: 84vw; top: 22%;"></div>
      <div class="cloud large" style="left: 104vw; top: 8%;"></div>
      <div class="cloud" style="left: 134vw; top: 18%;"></div>
      <div class="cloud small" style="left: 162vw; top: 6%;"></div>
      <div class="cloud large" style="left: 184vw; top: 22%;"></div>
    </div>
    <div class="cloud-layer mid">
      <div class="cloud" style="left: 14vw; top: 34%;"></div>
      <div class="cloud small" style="left: 46vw; top: 46%;"></div>
      <div class="cloud" style="left: 76vw; top: 30%;"></div>
      <div class="cloud small" style="left: 96vw; top: 42%;"></div>
      <div class="cloud" style="left: 114vw; top: 34%;"></div>
      <div class="cloud small" style="left: 146vw; top: 46%;"></div>
      <div class="cloud" style="left: 176vw; top: 30%;"></div>
      <div class="cloud small" style="left: 196vw; top: 42%;"></div>
    </div>
    <div class="cloud-layer front">
      <div class="cloud small" style="left: 24vw; top: 58%;"></div>
      <div class="cloud" style="left: 58vw; top: 65%;"></div>
      <div class="cloud small" style="left: 90vw; top: 55%;"></div>
      <div class="cloud small" style="left: 124vw; top: 58%;"></div>
      <div class="cloud" style="left: 158vw; top: 65%;"></div>
      <div class="cloud small" style="left: 190vw; top: 55%;"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="goat-wrap" id="goatWrap">
      <img class="goat-img" src="assets/goat.png" alt="A curious goat" draggable="false" />
    </div>
  </div>

  <footer>
    <a href="mailto:Anna@thegoat.lifestyle">Anna@thegoat.lifestyle</a>
  </footer>

  <script>
    const wrap = document.getElementById('goatWrap');

    // Target values driven by pointer position
    let targetX = 0.5;
    let targetY = 0.5;

    // Current (smoothed) values that actually get rendered
    let curX = 0.5;
    let curY = 0.5;

    const MAX_ROTATE = 26;   // degrees of head turn
    const MAX_TILT = 16;     // degrees of tilt on the other axis
    const MAX_TRANSLATE = 22; // px of "leaning toward" cursor
    const MAX_SCALE = 1.06;
    const EASE = 0.12;       // lerp factor -> higher = snappier

    function updateTarget(clientX, clientY) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      targetX = clientX / w;
      targetY = clientY / h;
    }

    window.addEventListener('mousemove', (e) => {
      updateTarget(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 0) {
        updateTarget(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // Gentle idle drift so the goat feels alive even without input
    let idleT = 0;
    let hasInteracted = false;
    window.addEventListener('mousemove', () => { hasInteracted = true; }, { once: true });
    window.addEventListener('touchstart', () => { hasInteracted = true; }, { once: true });

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function frame() {
      idleT += 0.012;

      let tx = targetX;
      let ty = targetY;

      if (!hasInteracted) {
        // subtle figure-eight idle motion before the user moves the mouse
        tx = 0.5 + Math.sin(idleT) * 0.12;
        ty = 0.5 + Math.sin(idleT * 1.7) * 0.06;
      }

      curX = lerp(curX, tx, EASE);
      curY = lerp(curY, ty, EASE);

      // normalize to -1..1 from center
      const nx = (curX - 0.5) * 2;
      const ny = (curY - 0.5) * 2;

      const rotateY = nx * MAX_ROTATE;        // turning head left/right
      const rotateX = -ny * MAX_TILT;         // tilting up/down
      const translateX = nx * MAX_TRANSLATE;
      const translateY = ny * (MAX_TRANSLATE * 0.6);
      const scale = 1 + Math.abs(nx * ny) * (MAX_SCALE - 1);

      wrap.style.transform =
        `translate(${translateX}px, ${translateY}px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(${scale})`;

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>

</body>
</html>
