<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>the goat</title>
<style>
  :root {
    --bg-top: #4f9eea;
    --bg-mid: #8ec4f2;
    --bg-bottom: #dcedfb;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: linear-gradient(to bottom, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    cursor: default;
    position: relative;
  }

  .sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .cloud-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 200%;
    height: 100%;
    display: flex;
    align-items: flex-start;
  }

  .cloud-layer.back {
    animation: drift 150s linear infinite;
    opacity: 0.55;
    filter: blur(3px);
  }

  .cloud-layer.mid {
    animation: drift 95s linear infinite;
    opacity: 0.75;
    filter: blur(1.5px);
  }

  .cloud-layer.front {
    animation: drift 60s linear infinite;
    opacity: 0.9;
  }

  .cloud {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }

  .cloud::before,
  .cloud::after {
    content: "";
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
  }

  .goat-wrap {
    position: relative;
    width: min(60vw, 520px);
    will-change: transform;
    transform-style: preserve-3d;
  }

  .goat-img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 50%;
    object-fit: cover;
    aspect-ratio: 1 / 1;
    object-position: 50% 42%;
    box-shadow:
      0 30px 60px -20px rgba(20, 40, 70, 0.35),
      0 10px 25px -10px rgba(20, 40, 70, 0.25);
    filter: saturate(1.05) contrast(1.02);
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .shadow {
    position: absolute;
    left: 50%;
    bottom: -6%;
    width: 70%;
    height: 8%;
    background: radial-gradient(ellipse at center, rgba(20,40,70,0.28) 0%, rgba(20,40,70,0) 70%);
    transform: translateX(-50%);
    filter: blur(2px);
    will-change: transform, opacity;
  }

  footer {
    position: fixed;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: rgba(30, 45, 70, 0.55);
    font-weight: 400;
  }

  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(30, 45, 70, 0.25);
    padding-bottom: 1px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }

  footer a:hover {
    color: rgba(30, 45, 70, 0.9);
    border-color: rgba(30, 45, 70, 0.6);
  }

  /* cloud shapes: each is a squashed blob built from a base circle
     plus two overlapping pseudo-circles so it reads as a cloud silhouette */
  .cloud { width: 140px; height: 46px; }
  .cloud::before { width: 80px; height: 80px; top: -40px; left: 18px; }
  .cloud::after  { width: 60px; height: 60px; top: -26px; left: 74px; }

  .cloud.small { width: 90px; height: 30px; }
  .cloud.small::before { width: 52px; height: 52px; top: -26px; left: 10px; }
  .cloud.small::after  { width: 40px; height: 40px; top: -17px; left: 48px; }

  .cloud.large { width: 200px; height: 64px; }
  .cloud.large::before { width: 110px; height: 110px; top: -55px; left: 26px; }
  .cloud.large::after  { width: 84px; height: 84px; top: -36px; left: 106px; }
</style>
</head>
<body>

  <div class="sky" aria-hidden="true">
    <div class="cloud-layer back">
      <div class="cloud large" style="left: 4vw; top: 8%;"></div>
      <div class="cloud" style="left: 34vw; top: 18%;"></div>
      <div class="cloud small" style="left: 62vw; top: 6%;"></div>
      <div class="cloud large" style="left: 84vw; top: 22%;"></div>
      <div class="cloud large" style="left: 104vw; top: 8%;"></div>
      <div class="cloud" style="left: 134vw; top: 18%;"></div>
      <div class="cloud small" style="left: 162vw; top: 6%;"></div>
      <div class="cloud large" style="left: 184vw; top: 22%;"></div>
    </div>
    <div class="cloud-layer mid">
      <div class="cloud" style="left: 14vw; top: 34%;"></div>
      <div class="cloud small" style="left: 46vw; top: 46%;"></div>
      <div class="cloud" style="left: 76vw; top: 30%;"></div>
      <div class="cloud small" style="left: 96vw; top: 42%;"></div>
      <div class="cloud" style="left: 114vw; top: 34%;"></div>
      <div class="cloud small" style="left: 146vw; top: 46%;"></div>
      <div class="cloud" style="left: 176vw; top: 30%;"></div>
      <div class="cloud small" style="left: 196vw; top: 42%;"></div>
    </div>
    <div class="cloud-layer front">
      <div class="cloud small" style="left: 24vw; top: 58%;"></div>
      <div class="cloud" style="left: 58vw; top: 65%;"></div>
      <div class="cloud small" style="left: 90vw; top: 55%;"></div>
      <div class="cloud small" style="left: 124vw; top: 58%;"></div>
      <div class="cloud" style="left: 158vw; top: 65%;"></div>
      <div class="cloud small" style="left: 190vw; top: 55%;"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="goat-wrap" id="goatWrap">
      <div class="shadow" id="goatShadow"></div>
      <img class="goat-img" src="assets/goat.jpeg" alt="A curious goat" draggable="false" />
    </div>
  </div>

  <footer>
    <a href="mailto:Anna@thegoat.lifestyle">Anna@thegoat.lifestyle</a>
  </footer>

  <script>
    const wrap = document.getElementById('goatWrap');
    const shadow = document.getElementById('goatShadow');

    // Target values driven by pointer position
    let targetX = 0.5;
    let targetY = 0.5;

    // Current (smoothed) values that actually get rendered
    let curX = 0.5;
    let curY = 0.5;

    const MAX_ROTATE = 26;   // degrees of head turn
    const MAX_TILT = 16;     // degrees of tilt on the other axis
    const MAX_TRANSLATE = 22; // px of "leaning toward" cursor
    const MAX_SCALE = 1.06;
    const EASE = 0.12;       // lerp factor -> higher = snappier

    function updateTarget(clientX, clientY) {
      const w = window.innerWidth;
      const h = window.innerHeight;
      targetX = clientX / w;
      targetY = clientY / h;
    }

    window.addEventListener('mousemove', (e) => {
      updateTarget(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 0) {
        updateTarget(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // Gentle idle drift so the goat feels alive even without input
    let idleT = 0;
    let hasInteracted = false;
    window.addEventListener('mousemove', () => { hasInteracted = true; }, { once: true });
    window.addEventListener('touchstart', () => { hasInteracted = true; }, { once: true });

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function frame() {
      idleT += 0.012;

      let tx = targetX;
      let ty = targetY;

      if (!hasInteracted) {
        // subtle figure-eight idle motion before the user moves the mouse
        tx = 0.5 + Math.sin(idleT) * 0.12;
        ty = 0.5 + Math.sin(idleT * 1.7) * 0.06;
      }

      curX = lerp(curX, tx, EASE);
      curY = lerp(curY, ty, EASE);

      // normalize to -1..1 from center
      const nx = (curX - 0.5) * 2;
      const ny = (curY - 0.5) * 2;

      const rotateY = nx * MAX_ROTATE;        // turning head left/right
      const rotateX = -ny * MAX_TILT;         // tilting up/down
      const translateX = nx * MAX_TRANSLATE;
      const translateY = ny * (MAX_TRANSLATE * 0.6);
      const scale = 1 + Math.abs(nx * ny) * (MAX_SCALE - 1);

      wrap.style.transform =
        `translate(${translateX}px, ${translateY}px) rotateY(${rotateY}deg) rotateX(${rotateX}deg) scale(${scale})`;

      const shadowScale = 1 - Math.abs(nx) * 0.15;
      const shadowShift = nx * 16;
      shadow.style.transform = `translateX(calc(-50% + ${shadowShift}px)) scale(${shadowScale}, 1)`;
      shadow.style.opacity = 0.9 - Math.abs(ny) * 0.3;

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>

</body>
</html>
